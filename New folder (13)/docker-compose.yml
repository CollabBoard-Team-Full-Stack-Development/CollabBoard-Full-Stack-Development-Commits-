version: '3.8'
services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_URL=http://localhost:5173
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=http://localhost:5000
        - VITE_SOCKET_URL=http://localhost:5000
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped